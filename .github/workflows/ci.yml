name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pinned: different clang-format releases disagree, so an unpinned tool
      # would fail on code that is correctly formatted locally
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find src tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

  build-and-test:
    name: ${{ matrix.name }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        include:
          - name: linux-gcc-14
            os: ubuntu-latest
            cc: gcc-14
            cxx: g++-14
            install: gcc-14 g++-14
          - name: linux-clang-18
            os: ubuntu-latest
            cc: clang-18
            cxx: clang++-18
            install: clang-18
          - name: macos-appleclang
            os: macos-latest
          - name: windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      # the project requires CMake 4, which is newer than the runner images ship
      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Install compiler
        if: matrix.install != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Test
        working-directory: build
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --output-on-failure
