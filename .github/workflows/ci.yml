name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pinned: different clang-format releases disagree, so an unpinned tool
      # would fail on code that is correctly formatted locally
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          find src tests \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-13, gcc-14]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # the project requires CMake 4, which is newer than the runner image ships
      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Set up compiler
        run: |
          CXX_COMPILER="${{ matrix.compiler }}"
          CXX_COMPILER="${CXX_COMPILER/gcc/g++}"
          sudo apt-get update
          sudo apt-get install -y "${{ matrix.compiler }}" "$CXX_COMPILER"
          echo "CC=${{ matrix.compiler }}" >> "$GITHUB_ENV"
          echo "CXX=$CXX_COMPILER"          >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        working-directory: build
        env:
          # leaks
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --output-on-failure
